<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Xenith — Облако</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1018}
a{color:#57E36F}a:hover{color:#8AF09A}
</style>
</helmet>
<div style="min-height: 900px; width: 100%; box-sizing: border-box; background: #0B1018; color: #F2F6FA; font-family: Onest, system-ui, sans-serif; font-size: 14px; line-height: 22px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap;">

  <nav aria-label="Разделы" style="width: 96px; flex: 0 0 96px; box-sizing: border-box; padding: 28px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; border-right: 1px solid rgba(145,161,180,.14);">
    <div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #57E36F; color: #062A10; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; margin-bottom: 24px;">X</div>
    <a href="Main.dc.html" style="width: 72px; padding: 10px 0 8px; border-radius: 14px; color: #91A1B4; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 16px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2"></rect><circle cx="12" cy="7" r="1.6"></circle><path d="M9 17h6"></path></svg>
      Консоль
    </a>
    <a href="Cloud.dc.html" aria-current="page" style="width: 72px; padding: 10px 0 8px; border-radius: 14px; background: #1A2635; color: #F2F6FA; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 16px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"></path></svg>
      Облако
    </a>
    <a href="Settings.dc.html" style="width: 72px; padding: 10px 0 8px; border-radius: 14px; color: #91A1B4; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; line-height: 16px;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
      Настройки
    </a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 40px 64px 32px; display: flex; flex-direction: column; gap: 28px; max-width: 1344px;">
    <header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-size: 31px; line-height: 36px; font-weight: 600;">Облако</h1>
        <p style="margin: 0; color: #91A1B4;">Игры Game Pass Ultimate запускаются на серверах Microsoft, консоль не нужна. Сервер: Швеция, выбран автоматически.</p>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; width: 340px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; background: #121C29; border: 1px solid rgba(145,161,180,.14);">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#91A1B4" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Поиск игры</span>
        <input type="search" placeholder="Найти игру" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F2F6FA; font: inherit; outline: none;">
      </label>
    </header>

    <div role="tablist" aria-label="Подборки" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 0; background: #F2F6FA; color: #0B1018; font: inherit; font-weight: 600;">Все игры</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(145,161,180,.22); background: transparent; color: #F2F6FA; font: inherit; font-weight: 500;">Недавние</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(145,161,180,.22); background: transparent; color: #F2F6FA; font: inherit; font-weight: 500;">Мышь и клавиатура</button>
      <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border-radius: 18px; border: 1px solid rgba(145,161,180,.22); background: transparent; color: #F2F6FA; font: inherit; font-weight: 500;">В Steam</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 20px 16px;">
      <sc-for list="{{games}}" as="g" hint-placeholder-count="12">
        <article style="display: flex; flex-direction: column; gap: 10px;">
          <button type="button" aria-label="{{g.label}}" style="{{g.coverStyle}}">
            <span style="color: #3A4A60; font-size: 12px;">[Обложка]</span>
          </button>
          <div style="display: flex; flex-direction: column;">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{g.title}}</span>
            <span style="color: #91A1B4; font-size: 12px; line-height: 16px;">{{g.meta}}</span>
          </div>
        </article>
      </sc-for>
    </div>

    <footer style="margin-top: auto; display: flex; gap: 24px; color: #62728A; font-size: 12px; line-height: 16px; flex-wrap: wrap;">
      <span><b style="color: #91A1B4; font-weight: 600;">A</b> играть</span>
      <span><b style="color: #91A1B4; font-weight: 600;">X</b> добавить в Steam</span>
      <span><b style="color: #91A1B4; font-weight: 600;">Y</b> поиск</span>
    </footer>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'aspect-ratio: 3 / 4; width: 100%; border-radius: 14px; background: #121C29; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; ';
    const games = Array.from({ length: 12 }, (_, i) => ({
      title: '[Название игры]',
      label: 'Открыть игру',
      meta: i % 3 === 0 ? 'Мышь и клавиатура' : (i % 4 === 1 ? 'В Steam' : 'Геймпад'),
      coverStyle: base + (i === 0 ? 'border: 0; outline: 2px solid #57E36F; outline-offset: 3px;' : 'border: 1px solid rgba(145,161,180,.10);'),
    }));
    return { games };
  }
}
</script>
</body>
</html>
